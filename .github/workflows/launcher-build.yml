name: launcher-build

# Builds the Horizon launcher (versions/<version>/launcher, its own Cargo
# workspace, excluded from the game workspace) for one version or for all
# 19 version trees, on Windows and Linux, and uploads each binary as an
# artifact — so the launcher can be downloaded from CI instead of built
# locally on a laptop.
#
# The launcher is a GPUI desktop app (horizon-launcher 0.2.0). Its
# Cargo.toml is identical in every version tree and every tree carries its
# own launcher/Cargo.lock, so one workflow shape fits all versions. The
# build is pure Rust: no Java (research-lock.json pins only the Java
# major, which the launcher build does not need), no Mojang downloads,
# nothing committed. Windows is a supported target upstream: the launcher
# carries Windows-only deps (keyring windows-native, windows-sys, winreg,
# winresource for the .exe icon) and upstream's launcher.yml builds it on
# windows-latest — the wayland/x11 features in its gpui-fast-platform
# dependency are Linux-only inside that crate and do not affect Windows.
#
# The shape follows upstream's launcher.yml (versions/<v>/.github/
# workflows/launcher.yml): Rust 1.95.0 (the version trees' rust-version,
# same as port-verify), a --locked release build in the launcher
# directory, the Linux system libraries GPUI links to, and
# -C target-feature=+crt-static on Windows so the .exe runs without the
# Visual C++ redistributable. Unlike upstream, this workflow builds only
# the binary — no AppImage, no installer, no release, no signing — and
# uploads it raw. Each version builds independently (fail-fast: false),
# so one broken tree never blocks the others.
#
# Dispatched manually:
#   gh workflow run launcher-build.yml -f version=1.21.7
#   gh workflow run launcher-build.yml -f version=all
# Binaries land in the horizon-launcher-<version>-<windows|ubuntu> artifacts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version directory under versions/ (e.g. 1.21.7), or 'all' for every version tree"
        required: true
        type: string

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version input into the build matrix
        id: matrix
        env:
          WANTED: ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import json, os
          wanted = os.environ["WANTED"]
          if wanted == "all":
              versions = sorted(
                  d for d in os.listdir("versions")
                  if os.path.isfile(os.path.join("versions", d, "launcher", "Cargo.toml"))
              )
              if not versions:
                  raise SystemExit("no version tree has a launcher/ directory")
          else:
              if not os.path.isfile(os.path.join("versions", wanted, "launcher", "Cargo.toml")):
                  raise SystemExit(f"no launcher in versions/{wanted}/launcher")
              versions = [wanted]
          print("versions:", ", ".join(versions))
          include = []
          for v in versions:
              # The C runtime linked in: without it the launcher asks for
              # VCRUNTIME140.dll, which only the Visual C++ redistributable
              # installs (upstream's launcher.yml).
              include.append({"version": v, "os": "windows", "runs-on": "windows-latest",
                              "binary": "horizon-launcher.exe",
                              "rustflags": "-C target-feature=+crt-static"})
              include.append({"version": v, "os": "ubuntu", "runs-on": "ubuntu-latest",
                              "binary": "horizon-launcher", "rustflags": ""})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
          EOF

  build:
    needs: resolve
    name: build ${{ matrix.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        # Git Bash on Windows too, so the build and smoke steps are the
        # same on both OSes (upstream's launcher.yml does the same).
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: versions/${{ matrix.version }}/launcher
          shared-key: launcher-${{ matrix.version }}-${{ matrix.os }}
          cache-on-failure: true

      # The Linux libraries GPUI links to (upstream's launcher.yml list,
      # minus libasound2-dev and patchelf: the launcher's lockfile has no
      # ALSA crate, and patchelf is only for the AppImage this workflow
      # does not build). A flaky archive mirror (port-verify run 1 died
      # on a DNS failure resolving it) must not take the whole job down,
      # so this stays continue-on-error, retried 3x; a failed install
      # then surfaces as a build failure with a clear cause.
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && \
            sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev pkg-config && break
            echo "apt attempt $attempt failed; retrying in 20s"
            sleep 20
          done

      # --locked: every version tree carries its own launcher/Cargo.lock.
      # The launcher's path dependencies reach into ../crates, so the
      # build compiles the shared crates from this version's tree.
      - name: Build the launcher
        run: |
          cd "versions/${{ matrix.version }}/launcher"
          cargo build --release --locked --color=never

      # --version prints before any window or GPU is needed, so this runs
      # headless on the runner (upstream's launcher.yml does the same).
      - name: The binary runs (--version)
        run: |
          BIN="versions/${{ matrix.version }}/launcher/target/release/${{ matrix.binary }}"
          OUT=$("$BIN" --version)
          echo "$OUT"
          EXPECTED="horizon-launcher $(sed -n 's/^version = "\(.*\)"/\1/p' "versions/${{ matrix.version }}/launcher/Cargo.toml" | head -1)"
          [ "$OUT" = "$EXPECTED" ] || { echo "::error::expected '$EXPECTED'"; exit 1; }

      - name: Upload the launcher binary
        uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-${{ matrix.version }}-${{ matrix.os }}
          path: versions/${{ matrix.version }}/launcher/target/release/${{ matrix.binary }}
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## launcher-build — ${{ matrix.version }} (${{ matrix.os }})"
            echo
            echo "binary: \`versions/${{ matrix.version }}/launcher/target/release/${{ matrix.binary }}\`"
            ls -l "versions/${{ matrix.version }}/launcher/target/release/${{ matrix.binary }}" 2>/dev/null || echo "binary missing"
          } >> "$GITHUB_STEP_SUMMARY"
