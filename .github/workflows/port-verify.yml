name: port-verify

# Verification runs for one published version tree (versions/<version>/):
# toolchain from the version's own research-lock.json, a full-workspace
# compile gate, the pipeline's prepare (downloads that version's jars
# from Mojang's CDN into a local version store — nothing Mojang-derived is
# committed or uploaded), and the version-port harness subset.
#
# v6 gates: the compile, prepare and lab-prepare steps FAIL the job when
# they fail (earlier versions ran them continue-on-error, so a run could
# finish green with a broken prepare). The harness step stays
# continue-on-error deliberately: harness failures ARE the measured
# profile, not an infrastructure failure. The run emits a machine-readable
# profile.json alongside the logs; VERSIONS.md scalars come from it.
# v6.2 added the "harnesses" map to that profile (the shape the delta
# gate consumes), the cargo-check.log alias, and the protocol-test step.
# v6.3 publishes the harness profile into versions/<v>/profile.json
# (stamped with the run's commit, via tools/publish_profile.py) and runs
# the delta gate against it; the profile and the verdict are uploaded as
# the delta-bar-<version> artifact. The judge step cannot fail the job —
# the verdict is the record, not a gate on the run.
#
# Dispatched manually:
#   gh workflow run port-verify.yml -f version=26.2
# Results land in the job summary and the `port-verify-<version>` artifact.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version directory under versions/ (e.g. 26.2, 26.1, 1.21.11)"
        required: true
        type: string

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_VERSIONS: ${{ github.workspace }}/.horizon-versions
  HORIZON_PORTS: ${{ github.workspace }}/.horizon-ports

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Log directory (created first, so artifacts exist even if a later step fails)
        run: mkdir -p "$GITHUB_WORKSPACE/ci-out"

      - name: Read the version's Java major from its research lock
        id: lock
        run: |
          V="${{ inputs.version }}"
          test -d "versions/$V" || { echo "no such version directory: versions/$V"; exit 1; }
          JAVA_MAJOR=$(python3 -c "import json;print(json.load(open('versions/$V/research-lock.json'))['minecraft']['java_major'])")
          echo "java_major=$JAVA_MAJOR" >> "$GITHUB_OUTPUT"
          echo "Version $V pins Java $JAVA_MAJOR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.lock.outputs.java_major }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: versions/${{ inputs.version }}
          cache-on-failure: true

      # BEFORE the compile gate, not before the harness stage: `cargo check
      # --workspace` builds horizon-client, whose alsa-sys build script needs
      # pkg-config + libasound at check time, not just at link time. Run 14
      # (26.3 control) failed the workspace check on exactly this, with the
      # install still sitting after the gate. A flaky archive mirror (run 1
      # died on a DNS failure resolving it) must not take the whole job down
      # with it, so this stays continue-on-error, retried 3x; a failed
      # install then surfaces as a compile-gate failure with a clear cause.
      - name: System libraries the workspace check and harness fixtures need
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && \
            (sudo apt-get install -y libasound2-dev libudev-dev pkg-config || \
             sudo apt-get install -y libasound2t64-dev libudev-dev pkg-config) && break
            echo "apt attempt $attempt failed; retrying in 20s"
            sleep 20
          done

      # The harness stage requires its candidate to be a git worktree
      # (port_harness checks for .git), so stage a committed copy of the
      # published tree — the check then measures exactly what is on main,
      # and the pipeline's writes land in the scratch copy.
      - name: Stage the published tree as the pipeline's candidate
        run: |
          V="${{ inputs.version }}"
          mkdir -p "$HORIZON_PORTS"
          cp -a "versions/$V" "$HORIZON_PORTS/$V"
          cd "$HORIZON_PORTS/$V"
          git init -q
          git add -A
          git -c user.email=port-verify@localhost -c user.name=port-verify commit -qm "published tree, as pushed"
          git log --oneline -1

      # Gate: the full workspace (lib + bins) must compile. This is the
      # check behind the "workspace compiles" claim in VERSIONS.md — the
      # old protocol-only check did not cover it.
      # `set -o pipefail` is load-bearing here: the runner's shell is
      # `bash -e` WITHOUT pipefail, so `cargo ... | tee` returns tee's
      # status and a failed check used to report success (run 14).
      # `--color=never` keeps the log plain text so `^error` counting works.
      - name: Compile gate — full workspace
        run: |
          set -o pipefail
          V="${{ inputs.version }}"
          cd "versions/$V"
          cargo check --workspace --color=never 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/workspace-check.log"
          echo "error lines: $(grep -c '^error' "$GITHUB_WORKSPACE/ci-out/workspace-check.log" || true)"

      # Reporting only, NOT a gate — yet. The 26.1 line carries 48 known
      # test-target errors (latent from its completion pass, which verified
      # library targets only); gating on all-targets today would fail every
      # 26.1-line run on known debt. This step keeps the count visible in
      # CI output; it becomes a gate once that test-code debt is fixed.
      - name: Test-target check (reporting only — 26.1-line debt)
        continue-on-error: true
        run: |
          set -o pipefail
          V="${{ inputs.version }}"
          cd "versions/$V"
          # Two names for one log: the emitter reads all-targets-check.log,
          # the delta gate (D2) reads ci-out/cargo-check.log.
          cargo check --workspace --all-targets --color=never 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/all-targets-check.log" "$GITHUB_WORKSPACE/ci-out/cargo-check.log"
          echo "error lines: $(grep -c '^error' "$GITHUB_WORKSPACE/ci-out/all-targets-check.log" || true)"

      # Reporting only, NOT a gate: the two sandbox-network protocol tests
      # fail on every runner by design, so gating here would fail every run.
      # The delta gate (D2) judges this log with its exemption list instead.
      - name: Protocol tests (recorded for the delta gate's D2)
        continue-on-error: true
        run: |
          set -o pipefail
          V="${{ inputs.version }}"
          cd "versions/$V"
          cargo test -p horizon-protocol --color=never 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/cargo-test-protocol.log"

      # --download: fetch this version's jars from Mojang's CDN into the
      # version store (SHA-1 verified) and run its data generator. Without
      # the flag the step demands a lab-prepared .local, which a clean
      # runner does not have. Obfuscated releases prepare through the
      # mappings front-end, wired into both prepare paths.
      # Gate: a failed prepare fails the job (v6; pipefail added in v6.1 —
      # without it the `| tee` swallowed the failure, as run 14 proved).
      - name: Prepare the version's data (pipeline download path)
        run: |
          set -o pipefail
          V="${{ inputs.version }}"
          cd "versions/$V"
          python3 tools/version_port.py prepare "$V" --download 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/prepare.log"

      # The candidate's horizon-prepare verifies a lab-prepared .local, which
      # lab.py builds by importing from a launcher-shaped directory. Stage
      # one from the version store (version json + client jar + every client
      # library artifact, SHA-1 verified) and run lab.py prepare inside the
      # candidate. Without this the harness stage dies on a missing
      # .local/minecraft/<version>/manifest.json.
      # Gate: a failed lab-prepare fails the job (v6; pipefail added in v6.1).
      - name: Lab-prepare the candidate from a staged launcher directory
        run: |
          set -o pipefail
          V="${{ inputs.version }}"
          LAUNCHER="$GITHUB_WORKSPACE/.launcher"
          python3 - "$V" "$LAUNCHER" <<'EOF'
          import hashlib, json, os, shutil, sys, urllib.request
          version, launcher = sys.argv[1], sys.argv[2]
          store = os.path.join(os.environ["HORIZON_VERSIONS"], version)
          meta = json.load(open(os.path.join(store, "version.json")))
          vdir = os.path.join(launcher, "versions", version)
          os.makedirs(vdir, exist_ok=True)
          shutil.copy(os.path.join(store, "version.json"), os.path.join(vdir, version + ".json"))
          shutil.copy(os.path.join(store, "jars", "client.jar"), os.path.join(vdir, version + ".jar"))
          def fetch(url, dest, sha1):
              if os.path.exists(dest) and hashlib.sha1(open(dest, "rb").read()).hexdigest() == sha1:
                  return
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              data = urllib.request.urlopen(url).read()
              assert hashlib.sha1(data).hexdigest() == sha1, f"sha1 mismatch: {url}"
              open(dest, "wb").write(data)
          count = 0
          for lib in meta.get("libraries", []):
              downloads = lib.get("downloads", {})
              entries = []
              if "artifact" in downloads:
                  entries.append(downloads["artifact"])
              entries.extend(downloads.get("classifiers", {}).values())
              for entry in entries:
                  fetch(entry["url"], os.path.join(launcher, "libraries", entry["path"]), entry["sha1"])
                  count += 1
          print(f"staged launcher dir at {launcher}: {count} library files")
          EOF
          cd "$HORIZON_PORTS/$V"
          HORIZON_MINECRAFT_DIR="$LAUNCHER" \
          HORIZON_SERVER_JAR="$HORIZON_VERSIONS/$V/jars/server.jar" \
            python3 tools/lab.py prepare 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/lab-prepare.log"

      # Stays continue-on-error DELIBERATELY: harness failures are the
      # measured profile, not an infrastructure failure. A version with
      # 14 failing harnesses is a successful measurement, and the job
      # must stay green so the profile (not the colour) is the record.
      - name: Harness subset (version-port profile)
        continue-on-error: true
        run: |
          set -o pipefail
          V="${{ inputs.version }}"
          cd "versions/$V"
          python3 tools/version_port.py harnesses --timeout 1800 "$V" \
            block_properties chunk_generation command_exec command_parse \
            component_patch datafix entity_components first_person food \
            hotbar item_model lan light options resource_pack save_roundtrip \
            sound_event 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/harnesses.log"

      - name: Collect pipeline results
        if: always()
        run: |
          V="${{ inputs.version }}"
          cp "$HORIZON_VERSIONS"/diff-*/harnesses.json "$GITHUB_WORKSPACE/ci-out/" 2>/dev/null || true
          cp -r "$HORIZON_VERSIONS"/diff-*/harness-logs "$GITHUB_WORKSPACE/ci-out/" 2>/dev/null || true
          cp "$HORIZON_PORTS/$V/.local/port-regen/horizon-prepare.log" "$GITHUB_WORKSPACE/ci-out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/ci-out/"

      # Machine-readable profile for VERSIONS.md / status.json. Written
      # even when the harness leg produced nothing, so a missing
      # harnesses.json is explicit (harness: null) rather than silent.
      - name: Emit machine-readable profile
        if: always()
        env:
          V: ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, re
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          out_dir = os.path.join(os.environ["GITHUB_WORKSPACE"], "ci-out")
          hj_path = os.path.join(out_dir, "harnesses.json")
          profile = {
              "version": os.environ["V"],
              "workflow": "port-verify",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "commit": os.environ.get("GITHUB_SHA"),
              "measured_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "prepare": None,
              "harness": None,
          }
          def error_lines(name):
              # Strip ANSI escapes first: cargo's coloured `error:` lines do
              # not start with "error", and run 14's profile counted 0 errors
              # for a build that failed (the cargo commands now also pass
              # --color=never; this is the belt to that braces).
              try:
                  with open(os.path.join(out_dir, name), errors="replace") as f:
                      return sum(1 for ln in f if ansi.sub("", ln).startswith("error"))
              except FileNotFoundError:
                  return None
          profile["compile"] = {
              "workspace_errors": error_lines("workspace-check.log"),
              "all_targets_errors": error_lines("all-targets-check.log"),
          }
          if os.path.exists(hj_path):
              hj = json.load(open(hj_path))
              profile["prepare"] = hj.get("prepare", {}).get("status")
              per = hj.get("harnesses", {})
              counts = {"pass": 0, "oracle": 0, "fail": 0, "other": 0}
              passing, failing, oracle_failing = [], [], []
              for name, entry in per.items():
                  st = entry.get("status", "other")
                  counts[st if st in counts else "other"] += 1
                  if st == "pass":
                      passing.append(name)
                  elif st == "oracle":
                      oracle_failing.append(name)
                  else:
                      failing.append(name)
              profile["harness"] = {
                  "pass": counts["pass"],
                  "oracle_fail": counts["oracle"],
                  "fail": counts["fail"],
                  "other": counts["other"],
                  "total": len(per),
                  "passing": sorted(passing),
                  "oracle_failing": sorted(oracle_failing),
                  "failing": sorted(failing),
              }
              # The per-harness map the delta gate (D4/D5) consumes: it
              # reads profile.json first and accepts a "harnesses" key
              # of {name: {"status": ...}} ("oracle" counts as not-pass).
              profile["harnesses"] = {
                  name: {"status": entry.get("status", "other")}
                  for name, entry in sorted(per.items())
              }
          else:
              profile["note"] = "no harnesses.json produced; the harness leg did not complete"
          with open(os.path.join(out_dir, "profile.json"), "w") as f:
              json.dump(profile, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(profile, indent=2, sort_keys=True))
          EOF

      # The delta bar judges a published record, not a worktree's scratch
      # state, and a profile stamped with another commit is refused
      # rather than believed. The publisher merges state files (so
      # sharded runs work later) and refuses to invent a profile from
      # nothing — if the harness leg produced no state, this step fails
      # harmlessly and the judge reports D4/D5 blocked.
      - name: Publish the harness profile (D4/D5 evidence)
        if: always()
        continue-on-error: true
        run: |
          V="${{ inputs.version }}"
          python3 tools/publish_profile.py "$V" \
            --state "$HORIZON_PORTS/$V/.local/parity-runner/state.json" \
            --commit "${{ github.sha }}" \
            --out "versions/$V/profile.json"

      # Reporting only, NOT a gate: the verdict is the record of what
      # this tree has and hasn't evidenced. The D2 logs live at the repo
      # root's ci-out/ but the gate reads them from the pin's ci-out/,
      # so stage copies beside the tree first. The verdict lands in
      # versions/$V/delta-verdict.json; neither file is committed
      # (permissions are contents: read) — the upload step carries them.
      - name: Judge the delta bar
        if: always()
        continue-on-error: true
        run: |
          V="${{ inputs.version }}"
          mkdir -p "versions/$V/ci-out"
          cp ci-out/cargo-check.log ci-out/cargo-test-protocol.log "versions/$V/ci-out/" 2>/dev/null || true
          python3 tools/delta_verify.py "$V" --tree "versions/$V" | tee ci-out/delta-verify.log

      - name: Upload the profile and the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-bar-${{ inputs.version }}
          path: |
            versions/${{ inputs.version }}/profile.json
            versions/${{ inputs.version }}/delta-verdict.json
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          V="${{ inputs.version }}"
          {
            echo "## port-verify — $V"
            echo
            echo "### full-workspace compile gate"
            echo "error lines: $(sed 's/\x1b\[[0-9;]*m//g' ci-out/workspace-check.log 2>/dev/null | grep -c '^error' || echo '?')"
            echo "all-targets error lines (reporting only): $(sed 's/\x1b\[[0-9;]*m//g' ci-out/all-targets-check.log 2>/dev/null | grep -c '^error' || echo '?')"
            echo
            echo "### protocol tests (D2)"
            grep -E '^test result:' ci-out/cargo-test-protocol.log 2>/dev/null | tail -1 || echo "no test log"
            echo
            echo "### prepare"
            echo '```'
            tail -5 ci-out/prepare.log 2>/dev/null || echo "no prepare log"
            echo '```'
            echo
            echo "### profile"
            echo '```json'
            cat ci-out/profile.json 2>/dev/null || echo "no profile.json"
            echo '```'
            echo
            echo "### harness run"
            grep -E '^(horizon-prepare|harnesses):' ci-out/harnesses.log 2>/dev/null || echo "no harness summary line"
            echo '```'
            tail -20 ci-out/harnesses.log 2>/dev/null || echo "no harness log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-verify-${{ inputs.version }}
          path: ci-out/
          if-no-files-found: warn
