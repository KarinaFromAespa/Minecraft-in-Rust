name: port-verify

# Verification runs for one published version tree (versions/<version>/):
# toolchain from the version's own research-lock.json, a protocol-crate
# compile baseline, the pipeline's prepare (downloads that version's jars
# from Mojang's CDN into a local version store — nothing Mojang-derived is
# committed or uploaded), and the version-port harness subset.
#
# Dispatched manually:
#   gh workflow run port-verify.yml -f version=26.2
# Results land in the job summary and the `port-verify-<version>` artifact.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version directory under versions/ (e.g. 26.2, 26.1, 1.21.11)"
        required: true
        type: string

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_VERSIONS: ${{ github.workspace }}/.horizon-versions
  HORIZON_PORTS: ${{ github.workspace }}/.horizon-ports

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Log directory (created first, so artifacts exist even if a later step fails)
        run: mkdir -p "$GITHUB_WORKSPACE/ci-out"

      - name: Read the version's Java major from its research lock
        id: lock
        run: |
          V="${{ inputs.version }}"
          test -d "versions/$V" || { echo "no such version directory: versions/$V"; exit 1; }
          JAVA_MAJOR=$(python3 -c "import json;print(json.load(open('versions/$V/research-lock.json'))['minecraft']['java_major'])")
          echo "java_major=$JAVA_MAJOR" >> "$GITHUB_OUTPUT"
          echo "Version $V pins Java $JAVA_MAJOR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.lock.outputs.java_major }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      # The harness stage requires its candidate to be a git worktree
      # (port_harness checks for .git), so stage a committed copy of the
      # published tree — the check then measures exactly what is on main,
      # and the pipeline's writes land in the scratch copy.
      - name: Stage the published tree as the pipeline's candidate
        run: |
          V="${{ inputs.version }}"
          mkdir -p "$HORIZON_PORTS"
          cp -a "versions/$V" "$HORIZON_PORTS/$V"
          cd "$HORIZON_PORTS/$V"
          git init -q
          git add -A
          git -c user.email=port-verify@localhost -c user.name=port-verify commit -qm "published tree, as pushed"
          git log --oneline -1

      - name: Compile baseline — horizon-protocol
        continue-on-error: true
        run: |
          V="${{ inputs.version }}"
          cd "versions/$V"
          cargo check -p horizon-protocol 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/protocol-check.log"
          echo "error lines: $(grep -c '^error' "$GITHUB_WORKSPACE/ci-out/protocol-check.log" || true)"

      # --download: fetch this version's jars from Mojang's CDN into the
      # version store (SHA-1 verified) and run its data generator. Without
      # the flag the step demands a lab-prepared .local, which a clean
      # runner does not have. Obfuscated releases are refused here until
      # the mappings front-end is wired into prepare.
      - name: Prepare the version's data (pipeline download path)
        continue-on-error: true
        run: |
          V="${{ inputs.version }}"
          cd "versions/$V"
          python3 tools/version_port.py prepare "$V" --download 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/prepare.log"

      # Only the harness stage links the client's audio/udev dependencies, so
      # the install lives here — and a flaky archive mirror (run 1 died on a
      # DNS failure resolving it) must not take the whole job down with it.
      - name: System libraries the harness fixtures link against
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && \
            (sudo apt-get install -y libasound2-dev libudev-dev pkg-config || \
             sudo apt-get install -y libasound2t64-dev libudev-dev pkg-config) && break
            echo "apt attempt $attempt failed; retrying in 20s"
            sleep 20
          done

      - name: Harness subset (version-port profile)
        continue-on-error: true
        run: |
          V="${{ inputs.version }}"
          cd "versions/$V"
          python3 tools/version_port.py harnesses --timeout 1800 "$V" \
            block_properties chunk_generation command_exec command_parse \
            component_patch datafix entity_components first_person food \
            hotbar item_model lan light options resource_pack save_roundtrip \
            sound_event 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/harnesses.log"

      - name: Collect pipeline results
        if: always()
        run: |
          V="${{ inputs.version }}"
          cp "$HORIZON_VERSIONS"/diff-*/harnesses.json "$GITHUB_WORKSPACE/ci-out/" 2>/dev/null || true
          cp -r "$HORIZON_VERSIONS"/diff-*/harness-logs "$GITHUB_WORKSPACE/ci-out/" 2>/dev/null || true
          cp "$HORIZON_PORTS/$V/.local/port-regen/horizon-prepare.log" "$GITHUB_WORKSPACE/ci-out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/ci-out/"

      - name: Job summary
        if: always()
        run: |
          V="${{ inputs.version }}"
          {
            echo "## port-verify — $V"
            echo
            echo "### horizon-protocol compile baseline"
            echo "error lines: $(sed 's/\x1b\[[0-9;]*m//g' ci-out/protocol-check.log 2>/dev/null | grep -c '^error' || echo '?')"
            echo
            echo "### prepare"
            echo '```'
            tail -5 ci-out/prepare.log 2>/dev/null || echo "no prepare log"
            echo '```'
            echo
            echo "### harness run"
            grep -E '^(horizon-prepare|harnesses):' ci-out/harnesses.log 2>/dev/null || echo "no harness summary line"
            echo '```'
            tail -20 ci-out/harnesses.log 2>/dev/null || echo "no harness log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-verify-${{ inputs.version }}
          path: ci-out/
          if-no-files-found: warn
