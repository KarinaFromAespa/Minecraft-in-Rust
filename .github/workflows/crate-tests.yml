name: crate-tests

# Runs the crate unit tests (cargo test --lib) for one version or for all
# 19 version trees, on Linux, and uploads each crate's log as an artifact.
# Dispatch-only: run it when a test needs running, never automatically.
#
# Why this exists: the VM cannot compile the horizon-client lib test
# suite at all — a single rustc exceeds 3 GB against the shared 6 GB
# cell and is OOM-killed even single-threaded via `taskset -c 0` (Nov 22,
# 2026, upgrade-play fix). The owner's standing rule since then: any
# test the VM can't run for resources goes to CI/Actions, never left
# verified statically only. This workflow is that route.
#
# What it runs, per version (dependency order, smallest first, so a
# cheap crate's result is never held up by the client's long compile):
#   cargo test -p horizon-protocol --color=never
#   cargo test -p horizon-items --lib --color=never
#   cargo test -p horizon-world --lib --color=never
#   cargo test -p horizon-client-core --lib --color=never
#   cargo test -p horizon-client-render --lib --color=never
#   cargo test -p horizon-client --lib --color=never
#   cargo test -p horizon-client-lib --lib --color=never
# horizon-protocol runs without --lib to match port-verify's D2 command.
# horizon-client-lib is the BIG client suite, not a shim: its lib root
# is ../horizon-client/src/client_lib.rs, the tree carrying save, mobs,
# and the rest of the client systems (4,328 test attrs in 1.21.7).
# horizon-client's own lib is only src/lib.rs (entry, game, mod_api).
# The first three runs omitted horizon-client-lib, so the save test
# from the upgrade-play fix never executed until it was added.
#
# A crate absent from a version's tree — or one with no lib target —
# is skipped, not failed; not every tree has identical crates. The step
# runs every crate even after a failure and exits non-zero if any crate
# failed, so one run reports all results. Skips are not failures: tests
# that print "skipping: ..." need prepared .local data a clean runner
# does not have, and exit 0.
#
# The workflow reports the raw result: it does not paper over failures.
# Pre-existing failures exist in several trees (e.g. 1.21.7
# horizon-world has 13, incl. datafix/dimension_type/growth/level), so
# a red run is not by itself a regression — read the log in the
# crate-tests-<version> artifact.
#
# Lean by design: cargo test only. No Mojang jars, no Java, no harness,
# no prepare step. Rust 1.95.0 (the version trees' rust-version, same
# as port-verify, client-build and launcher-build). No --locked:
# port-verify and the laptop build do not use it, and a stale
# game-workspace lockfile in any tree would fail its run.
#
# Dispatched manually:
#   gh workflow run crate-tests.yml -f version=1.21.7
#   gh workflow run crate-tests.yml -f version=all
# Logs land in the crate-tests-<version> artifacts.
#
# The defect-suite job (same dispatch, same matrix) runs the
# cross-version defect regression suite (tools/defect_suite.py,
# docs/DEFECT-SUITE.md) against the version's own jars: it checks the
# defect classes found in 1.21.7 playtesting — fuel tables, loot field
# names, advancement keys, bed models, menu sprites, tags — against
# this version, and reports the defect list. It runs in parallel with
# the crate tests, needs no Rust toolchain (the suite is stdlib-only
# Python), and is REPORT-ONLY: the job always succeeds when the suite
# itself runs — a failing check is a defect to fix, not a red gate.
# The JSON report lands in the defect-suite-<version> artifact. The
# suite's rust checks run inside the crate-tests job above (they are
# ordinary unit tests); rerun the suite locally with --crate-logs
# pointed at the downloaded crate-tests-<version> artifact to join
# the two results.
#
# Cache note: each version's rust-cache entry is large (the game
# workspace), and GitHub evicts cache LRU past the 10 GB repo limit, so
# a full-matrix run may rebuild some versions cold. Single-version
# dispatches are the normal case and keep their cache.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version directory under versions/ (e.g. 1.21.7), or 'all' for every version tree"
        required: true
        type: string

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version input into the test matrix
        id: matrix
        env:
          WANTED: ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import json, os
          wanted = os.environ["WANTED"]
          def is_tree(v):
              return os.path.isfile(os.path.join("versions", v, "Cargo.toml"))
          if wanted == "all":
              versions = sorted(d for d in os.listdir("versions") if is_tree(d))
              if not versions:
                  raise SystemExit("no version tree found under versions/")
          else:
              if not is_tree(wanted):
                  raise SystemExit(f"no version tree at versions/{wanted}")
              versions = [wanted]
          print("versions:", ", ".join(versions))
          include = [{"version": v} for v in versions]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
          EOF

  test:
    needs: resolve
    name: crate tests ${{ matrix.version }} (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: versions/${{ matrix.version }}
          shared-key: crate-tests-${{ matrix.version }}-linux
          cache-on-failure: true

      # The Linux libraries the GUI crates link to (winit/wgpu via
      # horizon-client and horizon-client-render) — the launcher
      # workflow's list. A flaky archive mirror (port-verify run 1 died
      # on a DNS failure resolving it) must not take the whole job down,
      # so this stays continue-on-error, retried 3x; a failed install
      # then surfaces as a build failure with a clear cause.
      - name: Linux libraries the client crates link to
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && \
            sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev pkg-config && break
            echo "apt attempt $attempt failed; retrying in 20s"
            sleep 20
          done

      # pipefail (port-verify v6.1 lesson): without it the `| tee`
      # would swallow a failing cargo exit code, as run 14 proved.
      # The loop runs every crate even after a failure and exits
      # non-zero if any crate failed; per-crate outcomes go to
      # _summary.txt for the job summary step.
      - name: Run the crate test suites
        id: tests
        run: |
          set -o pipefail
          cd "versions/${{ matrix.version }}"
          OUT="$GITHUB_WORKSPACE/ci-out/crate-tests"
          mkdir -p "$OUT"
          : > "$OUT/_summary.txt"
          CRATES="horizon-protocol horizon-items horizon-world horizon-client-core horizon-client-render horizon-client horizon-client-lib"
          FAILED=""
          for crate in $CRATES; do
            if [ ! -f "crates/$crate/Cargo.toml" ]; then
              echo "=== $crate: not in this tree, skipped ==="
              echo "$crate SKIP (no such crate)" >> "$OUT/_summary.txt"
              continue
            fi
            if [ ! -f "crates/$crate/src/lib.rs" ] && ! grep -q '^\[lib\]' "crates/$crate/Cargo.toml"; then
              echo "=== $crate: no lib target, skipped ==="
              echo "$crate SKIP (no lib target)" >> "$OUT/_summary.txt"
              continue
            fi
            echo "=== $crate ==="
            if [ "$crate" = "horizon-protocol" ]; then
              # No --lib: match port-verify's D2 command exactly.
              CMD="cargo test -p $crate --color=never"
            else
              CMD="cargo test -p $crate --lib --color=never"
            fi
            if $CMD 2>&1 | tee "$OUT/$crate.log"; then
              echo "=== $crate: PASS ==="
              echo "$crate PASS" >> "$OUT/_summary.txt"
            else
              echo "=== $crate: FAIL ==="
              echo "$crate FAIL" >> "$OUT/_summary.txt"
              FAILED="$FAILED $crate"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::failing crates:${FAILED}"
            exit 1
          fi

      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crate-tests-${{ matrix.version }}
          path: ci-out/crate-tests/
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## crate-tests — ${{ matrix.version }} (linux)"
            echo
            echo "artifact: \`crate-tests-${{ matrix.version }}\`"
            echo
            SUMMARY="$GITHUB_WORKSPACE/ci-out/crate-tests/_summary.txt"
            if [ -f "$SUMMARY" ]; then
              echo "| crate | result | test result |"
              echo "|---|---|---|"
              while read -r crate outcome rest; do
                LOG="$GITHUB_WORKSPACE/ci-out/crate-tests/$crate.log"
                if [ -f "$LOG" ]; then
                  counts=$(grep '^test result:' "$LOG" | tail -1 | sed 's/^test result: //' || true)
                  [ -n "$counts" ] || counts="no test-result line (see log)"
                else
                  counts="—"
                fi
                echo "| $crate | $outcome $rest | $counts |"
              done < "$SUMMARY"
            else
              echo "no test summary — the run failed before any crate ran"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The cross-version defect regression suite: the defect classes
  # found in 1.21.7 playtesting, checked against this version's own
  # jars. Report-only (see the header comment): the step fails only
  # when the suite itself cannot run, never on a failing check.
  defect-suite:
    needs: resolve
    name: defect suite ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # The suite's oracles are the version's own vanilla jars: the
      # server jar (loot tables, advancements, tags, component
      # strings) and the client jar (item models, menu sprites), plus
      # the 26.3 client jar (the menu-sprite fallback source).
      # Downloaded from Mojang's piston-meta manifest and verified
      # against the manifest sha1 — the leakage-audit job's pattern.
      # The jars are never committed and never uploaded.
      - name: Download the vanilla jars (sha1-verified)
        run: |
          V="${{ matrix.version }}"
          mkdir -p jars
          python3 - "$V" <<'EOF'
          import hashlib, json, subprocess, sys
          version = sys.argv[1]
          MANIFEST = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
          def fetch_json(url):
              out = subprocess.run(
                  ["curl", "-sS", "--retry", "3", "--retry-delay", "2",
                   "-m", "120", url],
                  capture_output=True, text=True, check=True)
              return json.loads(out.stdout)
          def download(version, kind, dest):
              detail = fetch_json(by_id[version]["url"])
              dl = detail.get("downloads", {}).get(kind)
              if not dl:
                  raise SystemExit(
                      f"{version}: no {kind} download in its version detail")
              subprocess.run(
                  ["curl", "-sS", "--retry", "3", "--retry-delay", "2",
                   "-m", "600", "-o", dest, dl["url"]], check=True)
              h = hashlib.sha1()
              with open(dest, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              if h.hexdigest() != dl["sha1"]:
                  raise SystemExit(
                      f"{version}: SHA1 MISMATCH {h.hexdigest()} != {dl['sha1']}")
              print(f"{version} {kind}: ok ({dl['size']} bytes, sha1 verified)")
          manifest = fetch_json(MANIFEST)
          by_id = {v["id"]: v for v in manifest["versions"]}
          if version not in by_id:
              raise SystemExit(f"{version}: NOT in the Mojang version manifest")
          if "26.3" not in by_id:
              raise SystemExit("26.3: NOT in the Mojang version manifest")
          download(version, "server", f"jars/{version}-server.jar")
          download(version, "client", f"jars/{version}-client.jar")
          download("26.3", "client", "jars/26.3-client.jar")
          EOF

      - name: Run the defect suite (report-only)
        id: suite
        run: |
          V="${{ matrix.version }}"
          python3 tools/defect_suite.py "$V" --jar-dir jars \
            --fallback-jar jars/26.3-client.jar --report-only --json \
            > "defect-suite-$V.json"
          python3 - "$V" <<'EOF'
          import json, sys
          version = sys.argv[1]
          try:
              result = json.load(open(f"defect-suite-{version}.json"))["results"][0]
          except (OSError, ValueError, KeyError, IndexError):
              print(f"::error::defect-suite: {version} produced no JSON result")
              sys.exit(1)
          summary = result["summary"]
          print(f"{version}: " + ", ".join(
              f"{n} {s}" for s, n in sorted(summary.items())))
          for check in result["checks"]:
              if check["status"] in ("fail", "unmeasured", "not-covered"):
                  print(f"  {check['status'].upper():<11} {check['id']}: "
                        f"{check['detail'][:300]}")
          EOF

      - name: Upload the defect-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defect-suite-${{ matrix.version }}
          path: defect-suite-${{ matrix.version }}.json
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## defect-suite — ${{ matrix.version }}"
            echo
            echo "artifact: \`defect-suite-${{ matrix.version }}\`"
            echo
            python3 - "${{ matrix.version }}" <<'EOF'
          import json, sys
          version = sys.argv[1]
          try:
              result = json.load(open(f"defect-suite-{version}.json"))["results"][0]
          except (OSError, ValueError, KeyError, IndexError):
              print("no defect-suite report — the run failed before the suite ran")
              sys.exit(0)
          print("| check | status |")
          print("|---|---|")
          for check in result["checks"]:
              print(f"| {check['id']} | {check['status']} |")
          print()
          for check in result["checks"]:
              if check["status"] == "fail":
                  print(f"- **{check['id']}**: {check['detail'][:500]}")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
